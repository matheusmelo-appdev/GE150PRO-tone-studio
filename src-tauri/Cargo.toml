[package]
name = "ge150-tone-studio"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
ge150-tone = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2"
tauri = { version = "2.9", features = [] }
tauri-plugin-dialog = "2.4"
